<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JASS Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }, darkbg: '#0f172a', darkcard: '#1e293b', darkborder: '#334155' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-input {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: #f1f5f9;
            font-size: 0.875rem;
        }
        .form-input:focus {
            outline: none;
            border-color: #22c55e;
        }
        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }
        .tab-btn {
            padding: 0.75rem 1rem;
            color: #94a3b8;
            border-bottom: 2px solid transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #f1f5f9; }
        .tab-btn.active {
            color: #22c55e;
            border-bottom-color: #22c55e;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans p-6">
    <header class="mb-4 flex justify-between items-center pb-4">
        <div>
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-screwdriver-wrench text-brand-500"></i>
                JASS Admin Configuration
            </h1>
            <p class="text-sm text-slate-400 mt-1">Manage database entities for dynamic property categories and prober tasks.</p>
        </div>
        <a href="/" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-darkborder transition flex items-center space-x-2">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Back to Dashboard</span>
        </a>
    </header>

    <div class="flex border-b border-darkborder mb-6">
        <button class="tab-btn active" onclick="switchTab('tab-cat')"><i class="fa-solid fa-folder-tree mr-2"></i>Categories</button>
        <button class="tab-btn" onclick="switchTab('tab-prop')"><i class="fa-solid fa-list-ul mr-2"></i>Properties</button>
        <button class="tab-btn" onclick="switchTab('tab-parser')"><i class="fa-solid fa-code mr-2"></i>Parsers</button>
        <button class="tab-btn" onclick="switchTab('tab-task')"><i class="fa-solid fa-terminal mr-2"></i>Tasks</button>
    </div>

    <!-- Categories -->
    <div id="tab-cat" class="tab-content grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2" id="cat-form-title">Create New Category</h2>
            <form id="form-category" class="space-y-4" onsubmit="submitCategory(event)">
                <input type="hidden" id="cat-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="form-label">System Name</label><input type="text" id="cat-name" required class="form-input" placeholder="e.g. ad_info"></div>
                    <div><label class="form-label">Display Name</label><input type="text" id="cat-display" required class="form-input" placeholder="e.g. Active Directory"></div>
                </div>
                <div><label class="form-label">Order (int)</label><input type="number" id="cat-order" value="0" class="form-input"></div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 px-4 rounded text-xs transition" id="cat-submit-btn">Save Category</button>
                    <button type="button" onclick="resetForm('cat')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded text-xs transition">Cancel</button>
                </div>
            </form>
        </div>
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2">Existing Categories</h2>
            <div id="categories-list" class="space-y-2 overflow-y-auto max-h-[600px] pr-2"></div>
        </div>
    </div>

    <!-- Properties -->
    <div id="tab-prop" class="tab-content hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2" id="prop-form-title">Create New Property</h2>
            <form id="form-property" class="space-y-4" onsubmit="submitProperty(event)">
                <input type="hidden" id="prop-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="form-label">System Name</label><input type="text" id="prop-name" required class="form-input" placeholder="e.g. domain_role"></div>
                    <div><label class="form-label">Display Name</label><input type="text" id="prop-display" required class="form-input" placeholder="e.g. Domain Role"></div>
                </div>
                <div><label class="form-label">Description</label><input type="text" id="prop-desc" class="form-input"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="form-label">Category</label>
                        <select id="prop-cat" required class="form-input"></select>
                    </div>
                    <div>
                        <label class="form-label">Data Type</label>
                        <select id="prop-type" class="form-input"><option value="string">String</option><option value="number">Number</option><option value="boolean">Boolean</option><option value="json">JSON</option></select>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 px-4 rounded text-xs transition" id="prop-submit-btn">Save Property</button>
                    <button type="button" onclick="resetForm('prop')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded text-xs transition">Cancel</button>
                </div>
            </form>
        </div>
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2">Existing Properties</h2>
            <div id="properties-list" class="space-y-2 overflow-y-auto max-h-[600px] pr-2"></div>
        </div>
    </div>

    <!-- Parsers -->
    <div id="tab-parser" class="tab-content hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2" id="parser-form-title">Create New Parser</h2>
            <form id="form-parser" class="space-y-4" onsubmit="submitParser(event)">
                <input type="hidden" id="parser-id">
                <div><label class="form-label">Name</label><input type="text" id="parser-name" required class="form-input" placeholder="e.g. parse_netstat"></div>
                <div><label class="form-label">Description</label><input type="text" id="parser-desc" class="form-input"></div>
                <div>
                    <label class="form-label">Python Code (must define def parse(output): )</label>
                    <textarea id="parser-code" required class="form-input font-mono text-xs" rows="10">def parse(output):
    import json
    return json.loads(output)</textarea>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 px-4 rounded text-xs transition" id="parser-submit-btn">Save Parser</button>
                    <button type="button" onclick="resetForm('parser')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded text-xs transition">Cancel</button>
                </div>
            </form>
        </div>
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2">Existing Parsers</h2>
            <div id="parsers-list" class="space-y-2 overflow-y-auto max-h-[600px] pr-2"></div>
        </div>
    </div>

    <!-- Tasks -->
    <div id="tab-task" class="tab-content hidden grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl h-fit">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2" id="task-form-title">Create New Task</h2>
            <form id="form-task" class="space-y-4" onsubmit="submitTask(event)">
                <input type="hidden" id="task-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="form-label">Name</label><input type="text" id="task-name" required class="form-input" placeholder="e.g. get_active_ports"></div>
                    <div>
                        <label class="form-label">Parser</label>
                        <select id="task-parser" class="form-input"><option value="">-- No Parser --</option></select>
                    </div>
                </div>
                <div><label class="form-label">Description</label><input type="text" id="task-desc" class="form-input"></div>
                <div>
                    <label class="form-label">Powershell Script Content</label>
                    <textarea id="task-content" required class="form-input font-mono text-xs" rows="8"></textarea>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="task-map" checked class="mr-2"> <label class="text-xs text-slate-300">Map JSON output to Host Properties</label>
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-brand-600 hover:bg-brand-500 text-white font-bold py-2 px-4 rounded text-xs transition" id="task-submit-btn">Save Task</button>
                    <button type="button" onclick="resetForm('task')" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded text-xs transition">Cancel</button>
                </div>
            </form>
        </div>
        <div class="bg-darkcard border border-darkborder rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-bold mb-6 border-b border-darkborder pb-2">Existing Tasks</h2>
            <div id="tasks-list" class="space-y-2 overflow-y-auto max-h-[600px] pr-2"></div>
        </div>
    </div>

    <script>
        let state = { categories: [], properties: [], parsers: [], tasks: [] };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.add('hidden'));
            
            document.querySelector(`button[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(tabId).classList.remove('hidden');
        }

        async function apiCall(url, method = 'GET', body = null) {
            const options = { method, headers: {} };
            if (body) {
                options.headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(body);
            }
            const res = await fetch(url, options);
            if (!res.ok) alert(`Error: ${res.statusText}`);
            return res.ok ? await res.json() : null;
        }

        async function reloadAll() {
            state.categories = await apiCall('/api/admin/categories') || [];
            state.properties = await apiCall('/api/admin/properties') || [];
            state.parsers = await apiCall('/api/admin/parsers') || [];
            state.tasks = await apiCall('/api/admin/tasks') || [];

            // Render Selects
            const catSelect = document.getElementById('prop-cat');
            catSelect.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.display_name}</option>`).join('');
            
            const parserSelect = document.getElementById('task-parser');
            parserSelect.innerHTML = '<option value="">-- No Parser --</option>' + state.parsers.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

            // Render Lists
            document.getElementById('categories-list').innerHTML = state.categories.map(c => `
                <div class="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-darkborder group hover:border-slate-500 transition">
                    <div><span class="font-bold text-brand-400">${c.display_name}</span> <span class="text-xs text-slate-400">(${c.name})</span></div>
                    <div class="flex gap-2">
                        <button onclick="editItem('cat', ${c.id})" class="text-blue-400 hover:text-blue-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="delItem('categories', ${c.id})" class="text-red-400 hover:text-red-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('properties-list').innerHTML = state.properties.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-darkborder group hover:border-slate-500 transition">
                    <div>
                        <div class="font-bold text-yellow-400">${p.display_name} <span class="text-[10px] text-slate-500 ml-1 uppercase border border-slate-600 rounded px-1">${p.data_type}</span></div>
                        <div class="text-xs text-slate-400">${p.name} (Cat ID: ${p.category_id})</div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editItem('prop', ${p.id})" class="text-blue-400 hover:text-blue-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="delItem('properties', ${p.id})" class="text-red-400 hover:text-red-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('parsers-list').innerHTML = state.parsers.map(p => `
                <div class="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-darkborder group hover:border-slate-500 transition">
                    <div><span class="font-bold text-pink-400">${p.name}</span> <div class="text-xs text-slate-400">${p.description||''}</div></div>
                    <div class="flex gap-2">
                        <button onclick="editItem('parser', ${p.id})" class="text-blue-400 hover:text-blue-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="delItem('parsers', ${p.id})" class="text-red-400 hover:text-red-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('tasks-list').innerHTML = state.tasks.map(t => `
                <div class="flex justify-between items-center p-3 bg-slate-800 rounded-lg border border-darkborder group hover:border-slate-500 transition">
                    <div class="overflow-hidden">
                        <div class="font-bold text-purple-400">${t.name}</div>
                        <div class="text-xs text-slate-400 truncate max-w-sm">${t.content}</div>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button onclick="editItem('task', ${t.id})" class="text-blue-400 hover:text-blue-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="delItem('tasks', ${t.id})" class="text-red-400 hover:text-red-300 text-xs opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function resetForm(type) {
            document.getElementById(`form-${type === 'cat' ? 'category' : type === 'prop' ? 'property' : type}`).reset();
            document.getElementById(`${type}-id`).value = '';
            document.getElementById(`${type}-form-title`).innerText = `Create New ${type.charAt(0).toUpperCase() + type.slice(1)}`;
            document.getElementById(`${type}-submit-btn`).innerText = `Save ${type.charAt(0).toUpperCase() + type.slice(1)}`;
            if(type === 'parser') document.getElementById('parser-code').value = 'def parse(output):\n    import json\n    return json.loads(output)';
        }

        function editItem(type, id) {
            let item;
            if (type === 'cat') {
                item = state.categories.find(c => c.id === id);
                document.getElementById('cat-id').value = item.id;
                document.getElementById('cat-name').value = item.name;
                document.getElementById('cat-display').value = item.display_name;
                document.getElementById('cat-order').value = item.order;
            } else if (type === 'prop') {
                item = state.properties.find(p => p.id === id);
                document.getElementById('prop-id').value = item.id;
                document.getElementById('prop-name').value = item.name;
                document.getElementById('prop-display').value = item.display_name;
                document.getElementById('prop-desc').value = item.description || '';
                document.getElementById('prop-cat').value = item.category_id;
                document.getElementById('prop-type').value = item.data_type;
            } else if (type === 'parser') {
                item = state.parsers.find(p => p.id === id);
                document.getElementById('parser-id').value = item.id;
                document.getElementById('parser-name').value = item.name;
                document.getElementById('parser-desc').value = item.description || '';
                document.getElementById('parser-code').value = item.code;
            } else if (type === 'task') {
                item = state.tasks.find(t => t.id === id);
                document.getElementById('task-id').value = item.id;
                document.getElementById('task-name').value = item.name;
                document.getElementById('task-desc').value = item.description || '';
                document.getElementById('task-content').value = item.content;
                document.getElementById('task-parser').value = item.parser_id || '';
                document.getElementById('task-map').checked = item.map_to_properties;
            }
            document.getElementById(`${type}-form-title`).innerText = `Edit ${type.charAt(0).toUpperCase() + type.slice(1)}`;
            document.getElementById(`${type}-submit-btn`).innerText = `Update ${type.charAt(0).toUpperCase() + type.slice(1)}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function submitCategory(e) { 
            e.preventDefault(); 
            const id = document.getElementById('cat-id').value;
            const data = { name: document.getElementById('cat-name').value, display_name: document.getElementById('cat-display').value, order: parseInt(document.getElementById('cat-order').value) };
            await apiCall(id ? `/api/admin/categories/${id}` : '/api/admin/categories', id ? 'PUT' : 'POST', data); 
            resetForm('cat'); reloadAll(); 
        }
        
        async function submitProperty(e) { 
            e.preventDefault(); 
            const id = document.getElementById('prop-id').value;
            const data = { name: document.getElementById('prop-name').value, display_name: document.getElementById('prop-display').value, description: document.getElementById('prop-desc').value, data_type: document.getElementById('prop-type').value, category_id: parseInt(document.getElementById('prop-cat').value) };
            await apiCall(id ? `/api/admin/properties/${id}` : '/api/admin/properties', id ? 'PUT' : 'POST', data); 
            resetForm('prop'); reloadAll(); 
        }
        
        async function submitParser(e) { 
            e.preventDefault(); 
            const id = document.getElementById('parser-id').value;
            const data = { name: document.getElementById('parser-name').value, description: document.getElementById('parser-desc').value, code: document.getElementById('parser-code').value };
            await apiCall(id ? `/api/admin/parsers/${id}` : '/api/admin/parsers', id ? 'PUT' : 'POST', data); 
            resetForm('parser'); reloadAll(); 
        }
        
        async function submitTask(e) { 
            e.preventDefault(); 
            const id = document.getElementById('task-id').value;
            const data = { name: document.getElementById('task-name').value, description: document.getElementById('task-desc').value, content: document.getElementById('task-content').value, script_type: 'powershell', map_to_properties: document.getElementById('task-map').checked, parser_id: document.getElementById('task-parser').value ? parseInt(document.getElementById('task-parser').value) : null };
            await apiCall(id ? `/api/admin/tasks/${id}` : '/api/admin/tasks', id ? 'PUT' : 'POST', data); 
            resetForm('task'); reloadAll(); 
        }

        async function delItem(type, id) {
            if(confirm('Are you sure you want to delete this item?')) {
                await apiCall(`/api/admin/${type}/${id}`, 'DELETE');
                reloadAll();
            }
        }

        window.onload = reloadAll;
    </script>
</body>
</html>
